<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>随译</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff; --panel: #ffffff; --side: #f6f7f9;
    --fg: #1f2328; --muted: #6b7280; --line: rgba(0,0,0,.10);
    --fill: rgba(0,0,0,.035); --brand: #2563eb; --brand-soft: rgba(37,99,235,.10);
    --ok: #16a34a; --err: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181b; --panel: #1f2024; --side: #1a1b1f;
      --fg: #ececf1; --muted: #9ca3af; --line: rgba(255,255,255,.12);
      --fill: rgba(255,255,255,.06); --brand: #60a5fa; --brand-soft: rgba(96,165,250,.16);
      --ok: #4ade80; --err: #f87171;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--fg); overflow: hidden;
    font: 13px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .app { display: flex; height: 100%; }

  /* 左侧导航 */
  .rail {
    width: 92px; flex: none; background: var(--side); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; align-items: center; padding: 14px 0; gap: 6px;
  }
  .brand { width: 40px; height: 40px; border-radius: 11px; background: var(--brand);
    color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 17px; margin-bottom: 10px; }
  .nav {
    width: 72px; border: 0; background: transparent; color: var(--muted);
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 9px 0; border-radius: 10px; cursor: pointer; font: inherit; font-size: 11.5px;
  }
  .nav:hover { background: var(--fill); color: var(--fg); }
  .nav.on { background: var(--brand-soft); color: var(--brand); font-weight: 600; }
  .nav svg { width: 19px; height: 19px; }
  .rail .spacer { flex: 1; }
  .rail .ver { font-size: 10.5px; color: var(--muted); }

  /* 内容区 */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .page { display: none; flex: 1; min-height: 0; flex-direction: column; padding: 16px 18px 14px; gap: 12px; overflow: auto; }
  .page.on { display: flex; }

  .langbar { display: flex; align-items: center; gap: 8px; flex: none; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px;
    border: 1px solid var(--line); border-radius: 8px; background: var(--fill); font-size: 12px;
  }
  select {
    font: inherit; font-size: 12.5px; color: inherit; background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; outline: none;
  }
  select:focus, input:focus, textarea:focus { border-color: var(--brand); }
  .swap { border: 1px solid var(--line); background: var(--fill); border-radius: 8px;
    width: 30px; height: 30px; display: grid; place-items: center; cursor: pointer; color: var(--muted); }
  .swap:hover { color: var(--brand); border-color: var(--brand); }
  .grow { flex: 1; }

  .cols { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    display: flex; flex-direction: column; min-height: 0; overflow: hidden;
  }
  .card-head { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted); }
  .card-body { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 10px 12px; gap: 8px; overflow: auto; }
  textarea#src {
    flex: 1; width: 100%; min-height: 120px; resize: none; border: 0; outline: none;
    background: transparent; color: inherit; font: inherit; font-size: 15px; line-height: 1.7;
  }
  .card-foot { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-top: 1px solid var(--line); }
  .count { font-size: 11.5px; color: var(--muted); }

  button.btn {
    font: inherit; font-size: 12.5px; padding: 6px 14px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--line); background: var(--fill); color: inherit;
  }
  button.btn:hover { border-color: var(--brand); color: var(--brand); }
  button.primary { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 600; padding: 7px 18px; }
  button.primary:hover { filter: brightness(1.06); color: #fff; }
  button.ghost { border-color: transparent; background: transparent; color: var(--muted); }
  button:disabled { opacity: .55; cursor: default; }
  .kbd { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; }

  .out { font-size: 15px; line-height: 1.75; white-space: pre-wrap; word-break: break-word; }
  .out.empty { color: var(--muted); font-size: 13px; }
  .status { font-size: 11.5px; }
  .status.ok { color: var(--ok); }
  .status.err { color: var(--err); }
  .spinner { width: 13px; height: 13px; border-radius: 50%; border: 2px solid var(--brand-soft);
    border-top-color: var(--brand); animation: spin .7s linear infinite; display: inline-block; vertical-align: -2px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .dict { border-top: 1px dashed var(--line); padding-top: 10px; margin-top: 4px; display: none; }
  .dict.on { display: block; }
  .dict .word { font-size: 15px; font-weight: 600; }
  .dict .ph { color: var(--muted); font-size: 12.5px; margin-left: 6px; }
  .dict .sense { margin-top: 7px; font-size: 12.5px; }
  .dict .pos { color: var(--brand); font-size: 11.5px; margin-right: 6px; }
  .dict ol { margin: 3px 0 0; padding-left: 18px; color: var(--fg); }
  .dict li { margin: 2px 0; }
  .dict .ex { margin-top: 8px; color: var(--muted); font-style: italic; font-size: 12px; }

  /* 列表页 */
  .list { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 8px; }
  .item { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--panel); }
  .item .top { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .item .src { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .tx { font-size: 13px; line-height: 1.65; max-height: 4.9em; overflow: hidden; }
  .item .acts { display: flex; gap: 6px; margin-top: 6px; }
  .item button { font-size: 11.5px; padding: 3px 9px; border-radius: 7px; border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; }
  .item button:hover { color: var(--brand); border-color: var(--brand); }
  .empty { color: var(--muted); font-size: 12.5px; padding: 26px 0; text-align: center; }
  .search { width: 100%; font: inherit; padding: 8px 11px; border-radius: 9px;
    border: 1px solid var(--line); background: var(--fill); color: inherit; outline: none; }

  /* 设置 */
  .setting { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; background: var(--panel); }
  .setting h3 { margin: 0 0 10px; font-size: 13px; }
  .field { display: block; margin-bottom: 12px; }
  .field:last-child { margin-bottom: 0; }
  .field .lbl { display: block; font-size: 11.5px; color: var(--muted); margin-bottom: 5px; }
  .field input[type=text], .field input[type=password], .field textarea {
    width: 100%; font: inherit; color: inherit; background: var(--fill);
    border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; outline: none;
  }
  .field textarea { min-height: 74px; resize: vertical; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  .radios { display: flex; gap: 10px; }
  .radio { flex: 1; border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; cursor: pointer; background: var(--fill); }
  .radio.on { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand) inset; }
  .radio b { display: block; font-size: 12.5px; margin-bottom: 2px; }
  .radio span { font-size: 11px; color: var(--muted); }
  .row { display: flex; align-items: center; gap: 8px; font-size: 12.5px; }
  .row input[type=checkbox] { width: 14px; height: 14px; accent-color: var(--brand); }
  .hint { font-size: 11.5px; color: var(--muted); margin-top: 6px; }
  .hide { display: none !important; }
  .toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
    background: rgba(0,0,0,.82); color: #fff; font-size: 12.5px; padding: 7px 14px;
    border-radius: 999px; opacity: 0; pointer-events: none; transition: opacity .18s ease;
  }
  .toast.on { opacity: 1; }
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand">译</div>
    <button class="nav on" data-tab="translate">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h9M8 4v3c0 4-2 6-5 7"/><path d="M6 11c1.5 2 3.5 3.2 6 4"/><path d="M13 20l4-10 4 10M14.6 16.6h4.8"/></svg>
      翻译
    </button>
    <button class="nav" data-tab="vocab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 4h11a2 2 0 0 1 2 2v14H7a2 2 0 0 1-2-2V4z"/><path d="M9 8h6M9 12h6"/></svg>
      生词本
    </button>
    <button class="nav" data-tab="history">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>
      历史
    </button>
    <button class="nav" data-tab="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M4.6 7.4l1.4 1.4M18 15.2l1.4 1.4M3 12h2M19 12h2M4.6 16.6l1.4-1.4M18 8.8l1.4-1.4"/></svg>
      设置
    </button>
    <span class="spacer"></span>
    <span class="ver" id="ver" title="当前版本"></span>
  </aside>

  <main class="main">
    <!-- 翻译 -->
    <section class="page on" id="page-translate">
      <div class="langbar">
        <span class="chip" id="srcLang">自动检测</span>
        <button class="swap" id="swap" title="交换语言">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M7 7h11l-3-3M17 17H6l3 3"/></svg>
        </button>
        <select id="target">
          <option value="zh-CN">中文</option>
          <option value="en">英语</option>
          <option value="ja">日语</option>
          <option value="ko">韩语</option>
          <option value="fr">法语</option>
          <option value="de">德语</option>
          <option value="es">西班牙语</option>
          <option value="ru">俄语</option>
          <option value="pt">葡萄牙语</option>
          <option value="zh-TW">繁体中文</option>
        </select>
        <select id="provider">
          <option value="google">免费线路</option>
          <option value="deepseek">DeepSeek 精翻</option>
        </select>
        <span class="grow"></span>
        <span class="kbd">⌘↩ 翻译</span>
      </div>

      <div class="cols">
        <div class="card">
          <div class="card-head">原文 <span class="grow"></span><span class="count" id="srcCount">0</span></div>
          <div class="card-body">
            <textarea id="src" placeholder="粘贴或输入要翻译的内容；单个英文单词会顺便查词。"></textarea>
          </div>
          <div class="card-foot">
            <button class="btn ghost" id="clear">清空</button>
            <button class="btn ghost" id="paste">粘贴</button>
            <span class="grow"></span>
            <button class="btn primary" id="go">翻译</button>
          </div>
        </div>

        <div class="card">
          <div class="card-head">
            译文
            <span class="grow"></span>
            <span class="status" id="status"></span>
          </div>
          <div class="card-body">
            <div class="out empty" id="out">译文会显示在这里</div>
            <div class="dict" id="dict">
              <div><span class="word" id="dWord"></span><span class="ph" id="dPh"></span></div>
              <div id="dSenses"></div>
              <div class="ex" id="dEx"></div>
            </div>
          </div>
          <div class="card-foot">
            <button class="btn ghost" id="copy" disabled>复制译文</button>
            <button class="btn ghost" id="saveWord" disabled>存生词</button>
            <span class="grow"></span>
            <span class="count" id="meta"></span>
          </div>
        </div>
      </div>
    </section>

    <!-- 生词本 -->
    <section class="page" id="page-vocab">
      <div class="langbar">
        <input class="search" id="vocabSearch" placeholder="搜索原文或译文" />
        <button class="btn" id="vocabExport">导出 Markdown</button>
        <button class="btn ghost" id="vocabClear">清空</button>
      </div>
      <div class="list" id="vocabList"></div>
    </section>

    <!-- 历史 -->
    <section class="page" id="page-history">
      <div class="langbar">
        <input class="search" id="historySearch" placeholder="搜索历史" />
        <button class="btn ghost" id="historyClear">清空历史</button>
      </div>
      <div class="list" id="historyList"></div>
    </section>

    <!-- 设置 -->
    <section class="page" id="page-settings">
      <div class="setting">
        <h3>翻译</h3>
        <label class="field">
          <span class="lbl">默认目标语言</span>
          <select id="sTarget">
            <option value="zh-CN">中文</option><option value="en">英语</option><option value="ja">日语</option>
            <option value="ko">韩语</option><option value="fr">法语</option><option value="de">德语</option>
            <option value="es">西班牙语</option><option value="ru">俄语</option><option value="pt">葡萄牙语</option>
            <option value="zh-TW">繁体中文</option>
          </select>
        </label>
        <div class="field">
          <span class="lbl">线路</span>
          <div class="radios">
            <div class="radio" data-provider="google"><b>免费线路</b><span>Google 翻译公开接口，免 key，适合日常</span></div>
            <div class="radio" data-provider="deepseek"><b>DeepSeek 精翻</b><span>按术语表精翻，需要 API Key</span></div>
          </div>
        </div>
        <label class="field">
          <span class="lbl">DeepSeek API Key</span>
          <input type="password" id="sKey" placeholder="sk-…（只存在本机）" />
        </label>
        <label class="field">
          <span class="lbl">术语表（每行「原文 = 译文」）</span>
          <textarea id="sGlossary" placeholder="prompt = 提示词&#10;embedding = 嵌入向量"></textarea>
        </label>
      </div>

      <div class="setting">
        <h3>系统</h3>
        <div class="row" style="margin-bottom:10px">
          <input type="checkbox" id="sAutostart" />
          <label for="sAutostart">登录时自动启动（常驻菜单栏）</label>
        </div>
        <div class="row" style="gap:8px">
          <span class="hint" id="permHint"></span>
          <span class="grow"></span>
          <button class="btn" id="openAx">打开「辅助功能」</button>
          <button class="btn" id="openInput">打开「输入监控」</button>
        </div>
      </div>
      <div class="toast" id="toast"></div>
    </section>
  </main>
</div>

<script>
const api = window.__TAURI__;
const invoke = (cmd, args) => api.core.invoke(cmd, args);
const $ = (id) => document.getElementById(id);

let cfg = { target: 'zh-CN', provider: 'google', deepseek_key: '', deepseek_model: 'deepseek-chat', glossary: [] };
let current = null;   // 最近一次翻译结果
let busy = false;

// ---------- 通用 ----------
function toast(text) {
  const t = $('toast');
  t.textContent = text;
  t.classList.add('on');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('on'), 1600);
}

function switchTab(tab) {
  const tabs = ['translate', 'vocab', 'history', 'settings'];
  if (!tabs.includes(tab)) tab = 'translate';
  document.querySelectorAll('.nav').forEach((b) => b.classList.toggle('on', b.dataset.tab === tab));
  document.querySelectorAll('.page').forEach((p) => p.classList.toggle('on', p.id === 'page-' + tab));
  if (tab === 'vocab') loadVocab();
  if (tab === 'history') loadHistory();
  if (tab === 'settings') loadSettings();
  if (tab === 'translate') setTimeout(() => $('src').focus(), 30);
}
window.__switchTab = switchTab;

document.querySelectorAll('.nav').forEach((b) => b.addEventListener('click', () => switchTab(b.dataset.tab)));

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch (_) {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy'); ta.remove(); return ok;
  }
}

function stamp(ts) {
  const d = new Date(ts * 1000);
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getMonth() + 1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

// ---------- 翻译 ----------
async function doTranslate() {
  const text = $('src').value.trim();
  if (!text) { toast('先输入点内容'); return; }
  if (busy) return;
  busy = true;
  $('go').disabled = true;
  $('status').className = 'status';
  $('status').innerHTML = '<span class="spinner"></span> 翻译中';
  $('out').classList.remove('empty');
  $('dict').classList.remove('on');

  // 单英文词顺便查词
  const isWord = /^[A-Za-z][A-Za-z'’-]{0,40}$/.test(text);

  try {
    const r = await invoke('translate_text', {
      text,
      target: $('target').value,
      provider: $('provider').value,
    });
    current = r;
    $('out').textContent = r.text;
    $('out').classList.remove('empty');
    $('status').textContent = `${r.detected || 'auto'} → ${r.target}`;
    $('status').className = 'status ok';
    $('copy').disabled = false;
    $('saveWord').disabled = false;
    $('meta').textContent = r.provider;
    if (isWord) {
      try {
        const d = await invoke('lookup_word', { word: text });
        renderDict(d);
      } catch (_) { /* 查不到就只显示翻译 */ }
    }
  } catch (err) {
    const msg = String(err);
    $('out').textContent = msg === 'empty' ? '没有可翻译的内容' : '翻译失败：' + msg;
    $('out').classList.remove('empty');
    $('status').textContent = '失败';
    $('status').className = 'status err';
    $('copy').disabled = true;
    $('saveWord').disabled = true;
    $('meta').textContent = '';
  } finally {
    busy = false;
    $('go').disabled = false;
  }
}

function renderDict(d) {
  $('dWord').textContent = d.word;
  $('dPh').textContent = d.phonetic ? d.phonetic : '';
  const box = $('dSenses');
  box.innerHTML = '';
  (d.senses || []).forEach((s) => {
    const div = document.createElement('div');
    div.className = 'sense';
    const pos = document.createElement('span');
    pos.className = 'pos';
    pos.textContent = s.pos;
    div.appendChild(pos);
    const ol = document.createElement('ol');
    (s.defs || []).forEach((def) => {
      const li = document.createElement('li');
      li.textContent = def;
      ol.appendChild(li);
    });
    div.appendChild(ol);
    box.appendChild(div);
  });
  $('dEx').textContent = d.example ? '例：' + d.example : '';
  $('dict').classList.add('on');
}

$('go').addEventListener('click', doTranslate);
$('clear').addEventListener('click', () => { $('src').value = ''; updateCount(); $('src').focus(); });
$('paste').addEventListener('click', async () => {
  try {
    const t = await navigator.clipboard.readText();
    if (t) { $('src').value = t; updateCount(); }
  } catch (_) { toast('读剪贴板失败，按 ⌘V 试试'); }
});
$('copy').addEventListener('click', async () => {
  if (!current) return;
  toast((await copyText(current.text)) ? '已复制译文' : '复制失败');
});
$('saveWord').addEventListener('click', async () => {
  if (!current) return;
  try {
    const added = await invoke('add_vocab', {
      source: current.source, text: current.text,
      detected: current.detected || '', target: current.target || '',
    });
    toast(added ? '已存进生词本' : '已经在生词本里了');
  } catch (_) { toast('存不进去'); }
});
$('swap').addEventListener('click', () => {
  const t = $('target');
  if (t.value.startsWith('zh')) { t.value = 'en'; } else { t.value = 'zh-CN'; }
  toast('目标语言切到 ' + t.options[t.selectedIndex].text);
});
$('src').addEventListener('input', updateCount);
$('src').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); doTranslate(); }
});
function updateCount() {
  const n = $('src').value.length;
  $('srcCount').textContent = n ? n + ' 字' : '0';
}
window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { invoke('close_main_window').catch(() => {}); }
});

// ---------- 生词本 ----------
let vocab = [];
async function loadVocab() {
  vocab = await invoke('list_vocab', { limit: 500 }).catch(() => []);
  renderVocab();
}
function renderVocab() {
  const q = $('vocabSearch').value.trim().toLowerCase();
  const items = vocab.filter((v) => !q || (v.source + ' ' + v.text).toLowerCase().includes(q));
  const box = $('vocabList');
  box.innerHTML = '';
  if (!items.length) {
    box.innerHTML = '<div class="empty">' + (vocab.length ? '没有匹配的生词' : '还没有生词，翻译后点「存生词」') + '</div>';
    return;
  }
  items.slice().reverse().forEach((v) => {
    const el = document.createElement('div');
    el.className = 'item';
    el.innerHTML = `<div class="top"><span class="src"></span><span>${stamp(v.ts)}</span></div>
      <div class="tx"></div>
      <div class="acts"><button data-a="copy">复制</button><button data-a="del">删除</button></div>`;
    el.querySelector('.src').textContent = v.source;
    el.querySelector('.tx').textContent = v.text;
    el.querySelector('[data-a=copy]').onclick = async () => toast((await copyText(v.text)) ? '已复制' : '复制失败');
    el.querySelector('[data-a=del]').onclick = async () => {
      await invoke('remove_vocab', { ts: v.ts });
      loadVocab();
    };
    box.appendChild(el);
  });
}
$('vocabSearch').addEventListener('input', renderVocab);
$('vocabExport').addEventListener('click', async () => {
  const md = await invoke('export_vocab_markdown').catch(() => '');
  toast((await copyText(md || '')) ? 'Markdown 已复制到剪贴板' : '导出失败');
});
$('vocabClear').addEventListener('click', async () => {
  if (!vocab.length) return;
  if (!confirm('清空生词本？这个操作不能撤销。')) return;
  await invoke('clear_vocab'); loadVocab();
});

// ---------- 历史 ----------
let history = [];
async function loadHistory() {
  history = await invoke('list_history', { limit: 500 }).catch(() => []);
  renderHistory();
}
function renderHistory() {
  const q = $('historySearch').value.trim().toLowerCase();
  const items = history.filter((h) => !q || (h.source + ' ' + h.text).toLowerCase().includes(q));
  const box = $('historyList');
  box.innerHTML = '';
  if (!items.length) {
    box.innerHTML = '<div class="empty">' + (history.length ? '没有匹配的记录' : '还没有翻译记录') + '</div>';
    return;
  }
  items.forEach((h) => {
    const el = document.createElement('div');
    el.className = 'item';
    el.innerHTML = `<div class="top"><span>${(h.detected || 'auto')} → ${h.target || ''}</span><span class="src"></span><span>${stamp(h.ts)}</span></div>
      <div class="tx"></div>
      <div class="acts"><button data-a="copy">复制译文</button><button data-a="again">用原文再翻</button></div>`;
    el.querySelector('.src').textContent = (h.source || '').slice(0, 60);
    el.querySelector('.tx').textContent = h.text;
    el.querySelector('[data-a=copy]').onclick = async () => toast((await copyText(h.text)) ? '已复制' : '复制失败');
    el.querySelector('[data-a=again]').onclick = () => {
      switchTab('translate');
      $('src').value = h.source;
      updateCount();
    };
    box.appendChild(el);
  });
}
$('historySearch').addEventListener('input', renderHistory);
$('historyClear').addEventListener('click', async () => {
  if (!history.length) return;
  if (!confirm('清空历史记录？')) return;
  await invoke('clear_history'); loadHistory();
});

// ---------- 设置 ----------
async function loadSettings() {
  cfg = await invoke('get_config').catch(() => cfg);
  $('sTarget').value = cfg.target || 'zh-CN';
  $('sKey').value = cfg.deepseek_key || '';
  $('sGlossary').value = (cfg.glossary || []).map((g) => g.from + ' = ' + g.to).join('\n');
  document.querySelectorAll('.radio').forEach((r) => r.classList.toggle('on', r.dataset.provider === (cfg.provider || 'google')));
  $('provider').value = cfg.provider || 'google';
  $('target').value = cfg.target || 'zh-CN';
  const auto = await invoke('get_autostart').catch(() => false);
  $('sAutostart').checked = !!auto;
  const perm = await invoke('permission_state').catch(() => null);
  $('permHint').textContent = perm
    ? `辅助功能：${perm.accessibility ? '已授权' : '未授权'} · 输入监控：${perm.inputMonitoring === null ? '不适用' : (perm.inputMonitoring ? '已授权' : '未授权')}`
    : '';
}
document.querySelectorAll('.radio').forEach((r) => r.addEventListener('click', () => {
  document.querySelectorAll('.radio').forEach((x) => x.classList.remove('on'));
  r.classList.add('on');
  saveSettings();
}));
function saveSettings() {
  const provider = document.querySelector('.radio.on')?.dataset.provider || 'google';
  const glossary = $('sGlossary').value.split('\n').map((line) => line.trim()).filter(Boolean).map((line) => {
    const i = line.indexOf('=');
    if (i < 0) return null;
    return { from: line.slice(0, i).trim(), to: line.slice(i + 1).trim() };
  }).filter(Boolean);
  const next = {
    target: $('sTarget').value,
    provider,
    deepseek_key: $('sKey').value.trim(),
    deepseek_model: cfg.deepseek_model || 'deepseek-chat',
    glossary,
  };
  cfg = { ...cfg, ...next };
  $('provider').value = provider;
  $('target').value = next.target;
  return invoke('set_config', { cfg }).then(() => toast('已保存')).catch(() => toast('保存失败'));
}
['sTarget', 'sKey', 'sGlossary'].forEach((id) => $(id).addEventListener('change', saveSettings));
$('sAutostart').addEventListener('change', async (e) => {
  const ok = await invoke('set_autostart', { enabled: e.target.checked }).then(() => true).catch(() => false);
  if (!ok) e.target.checked = !e.target.checked;
  toast(ok ? '已更新开机启动' : '设置失败');
});
$('openAx').addEventListener('click', () => invoke('open_permission_settings'));
$('openInput').addEventListener('click', () => invoke('open_input_settings'));

// ---------- 启动 ----------
(async () => {
  await loadSettings();
  $('ver').textContent = '0.4.1';
  updateCount();
  const tab = new URLSearchParams(location.search).get('tab');
  switchTab(tab || 'translate');
})();
</script>
</body>
</html>
