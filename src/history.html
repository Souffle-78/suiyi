<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>随译 · 历史</title>
<style>
  :root {
    color-scheme: light dark;
    --bg:#fff; --fg:#1f2328; --muted:#6b7280; --line:rgba(0,0,0,.10); --fill:rgba(0,0,0,.03); --brand:#2563eb;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1c1c1e; --fg:#ececf1; --muted:#9ca3af; --line:rgba(255,255,255,.12); --fill:rgba(255,255,255,.06); }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--fg); display: flex; flex-direction: column;
    font: 13px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  header { padding: 16px 18px 10px; border-bottom: 1px solid var(--line); }
  .top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  h1 { font-size: 15px; margin: 0; flex: 1; }
  input[type=search] {
    width: 100%; font: inherit; color: inherit; background: var(--fill);
    border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; outline: none;
  }
  input[type=search]:focus { border-color: var(--brand); }
  button {
    font: inherit; font-size: 12px; padding: 5px 12px; border-radius: 7px; cursor: pointer;
    border: 1px solid var(--line); background: var(--fill); color: inherit;
  }
  button:hover { background: rgba(0,0,0,.07); }
  @media (prefers-color-scheme: dark) { button:hover { background: rgba(255,255,255,.10); } }
  button.danger { color: #dc2626; }
  .list { flex: 1; overflow-y: auto; padding: 12px 18px 24px; display: flex; flex-direction: column; gap: 10px; }
  .item { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .meta { display: flex; gap: 8px; align-items: center; font-size: 11.5px; color: var(--muted); margin-bottom: 4px; }
  .tag { padding: 1px 6px; border-radius: 5px; background: rgba(37,99,235,.10); color: var(--brand); }
  .src { color: var(--muted); font-size: 12px; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .out { white-space: pre-wrap; word-break: break-word; }
  .actions { display: flex; gap: 6px; margin-top: 8px; }
  .empty { color: var(--muted); text-align: center; padding: 40px 0; }
  .grow { flex: 1; }
  .tabs { display: inline-flex; gap: 2px; padding: 2px; border-radius: 8px; background: var(--fill);
          border: 1px solid var(--line); margin-bottom: 10px; }
  .tab { border: 0; background: transparent; padding: 4px 12px; border-radius: 6px; font-size: 12px; color: var(--muted); }
  .tab.on { background: var(--bg); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
</style>
</head>
<body>
<header>
  <div class="top">
    <h1 id="title">历史记录</h1>
    <button id="export" class="hidden">导出 Markdown</button>
    <button id="clear" class="danger">清空</button>
  </div>
  <div class="tabs">
    <button class="tab on" data-mode="history">历史</button>
    <button class="tab" data-mode="vocab">生词本</button>
  </div>
  <input id="q" type="search" placeholder="搜索原文或译文…" />
</header>
<div class="list" id="list"><div class="empty">还没有记录。去任意应用里划词试试。</div></div>
<script>
  const api = window.__TAURI__;
  const $ = (id) => document.getElementById(id);
  let mode = 'history';
  let items = [];
  let vocab = [];

  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function fmt(ts) {
    const d = new Date(ts * 1000);
    const p = (n) => String(n).padStart(2, '0');
    return `${d.getMonth() + 1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`;
  }

  function copyBtn(label, text) {
    const b = el('button', '', label);
    b.onclick = async () => {
      if (!text) return;
      try { await navigator.clipboard.writeText(text); b.textContent = '已复制'; }
      catch (_) { b.textContent = '复制失败'; }
      setTimeout(() => { b.textContent = label; }, 1200);
    };
    return b;
  }

  function card(it, kind) {
    const box = el('div', 'item');
    const meta = el('div', 'meta');
    meta.append(
      el('span', '', fmt(it.ts)),
      el('span', 'tag', (it.detected || 'auto') + ' → ' + (it.target || '')),
      el('span', '', kind === 'vocab' ? '生词' : (it.provider || ''))
    );
    const src = el('div', 'src', (it.source || '').replace(/\s+/g, ' ').slice(0, 140));
    const out = el('div', 'out', it.text || '');
    const actions = el('div', 'actions');
    if (kind === 'vocab') {
      actions.append(copyBtn('复制原文', it.source), copyBtn('复制译文', it.text));
      const del = el('button', 'danger', '删除');
      del.onclick = async () => {
        if (!api) return;
        try {
          await api.core.invoke('remove_vocab', { ts: it.ts });
          vocab = vocab.filter((v) => v.ts !== it.ts);
          render();
        } catch (_) {}
      };
      actions.appendChild(del);
    } else {
      actions.append(copyBtn('复制译文', it.text));
    }
    box.append(meta, src, out, actions);
    return box;
  }

  function render() {
    const q = $('q').value.trim().toLowerCase();
    const list = $('list');
    const source = mode === 'vocab' ? vocab : items;
    const shown = q
      ? source.filter((it) => ((it.source || '') + ' ' + (it.text || '')).toLowerCase().includes(q))
      : source;
    list.innerHTML = '';
    if (!shown.length) {
      const empty = mode === 'vocab'
        ? (source.length ? '没有匹配的生词' : '生词本还是空的。在气泡上点「存生词」就会收进来。')
        : (source.length ? '没有匹配的记录' : '还没有记录。去任意应用里划词试试。');
      list.appendChild(el('div', 'empty', empty));
      return;
    }
    for (const it of shown) list.appendChild(card(it, mode));
  }

  function paintMode() {
    document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('on', t.dataset.mode === mode));
    $('title').textContent = mode === 'vocab' ? '生词本' : '历史记录';
    $('q').placeholder = mode === 'vocab' ? '搜索生词或译文…' : '搜索原文或译文…';
    $('export').classList.toggle('hidden', mode !== 'vocab');
    $('clear').classList.toggle('hidden', mode === 'vocab' && !vocab.length);
  }

  document.querySelectorAll('.tab').forEach((t) => {
    t.onclick = () => { mode = t.dataset.mode; paintMode(); render(); };
  });

  async function load() {
    if (!api) return;
    try { items = await api.core.invoke('list_history', { limit: 500 }); } catch (_) { items = []; }
    try { vocab = await api.core.invoke('list_vocab', { limit: 2000 }); } catch (_) { vocab = []; }
    paintMode();
    render();
  }

  $('q').oninput = render;

  $('export').onclick = async () => {
    if (!api || !vocab.length) return;
    try {
      const md = await api.core.invoke('export_vocab_markdown');
      await navigator.clipboard.writeText(md);
      $('export').textContent = '已复制 ' + vocab.length + ' 条';
    } catch (_) {
      $('export').textContent = '导出失败';
    }
    setTimeout(() => { $('export').textContent = '导出 Markdown'; }, 1800);
  };

  $('clear').onclick = async () => {
    if (!api) return;
    if (mode === 'vocab') {
      if (!vocab.length || !confirm('清空整个生词本？')) return;
      await api.core.invoke('clear_vocab');
      vocab = [];
    } else {
      if (!items.length || !confirm('清空全部历史记录？')) return;
      await api.core.invoke('clear_history');
      items = [];
    }
    render();
  };

  load();
</script>
</body>
</html>
