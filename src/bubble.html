<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>素笺</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  body {
    font: 13px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }
  .card {
    margin: 4px; border-radius: 14px; padding: 12px 14px;
    background: rgba(255,255,255,0.97);
    border: 1px solid rgba(0,0,0,0.08);
    box-shadow: 0 10px 28px rgba(0,0,0,0.18);
    height: calc(100vh - 8px);
    display: flex; flex-direction: column; gap: 6px;
    overflow: hidden;
  }
  body.dark .card {
    background: rgba(32,32,34,0.97); border-color: rgba(255,255,255,0.10);
    color: #ececf1;
  }
  .row { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .tag {
    font-size: 11px; padding: 1px 6px; border-radius: 5px;
    background: rgba(59,130,246,0.12); color: #2563eb;
  }
  body.dark .tag { background: rgba(96,165,250,0.16); color: #93c5fd; }
  .src { font-size: 12px; color: #6b7280; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  body.dark .src { color: #9ca3af; }
  .out {
    min-height: 0;
    font-size: 15px; line-height: 1.65; white-space: pre-wrap; word-break: break-word;
    flex: 1; overflow-y: auto; padding-right: 2px;
  }
  .err { color: #dc2626; font-size: 13px; }
  .foot { display:flex; gap: 4px; margin-top: 2px; flex: none; }
  .foot button { font-size: 11.5px; padding: 3px 7px; white-space: nowrap; flex: none; }
  button {
    font: inherit; font-size: 12px; padding: 4px 10px; border-radius: 7px;
    border: 1px solid rgba(0,0,0,0.10); background: rgba(0,0,0,0.03);
    color: inherit; cursor: pointer;
  }
  button:hover { background: rgba(0,0,0,0.07); }
  body.dark button { border-color: rgba(255,255,255,0.14); background: rgba(255,255,255,0.06); }
  body.dark button:hover { background: rgba(255,255,255,0.12); }
  .grow { flex: 1; }
  /* 单词卡片（Windows / Linux 用；macOS 走 NSPanel 助手） */
  .word { display: none; flex: 1; min-height: 0; flex-direction: column; gap: 2px; overflow-y: auto; padding-right: 2px; }
  .card.is-word .row { display: none; }
  .card.is-word .out { display: none; }
  .card.is-word .word { display: flex; }
  .hw { font-size: 19px; font-weight: 600; line-height: 1.25; margin-bottom: 2px; }
  .ph { font-size: 12px; color: #6b7280; margin-bottom: 2px; }
  body.dark .ph { color: #9ca3af; }
  .ph b { font-weight: 500; color: #9ca3af; margin-right: 3px; }
  body.dark .ph b { color: #8b8f98; }
  .tags { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 4px; }
  .main { font-size: 14px; font-weight: 600; margin: 6px 0 4px; }
  .sense { font-size: 12.5px; line-height: 1.55; margin: 3px 0; }
  .sense .pos { color: #6b7280; font-weight: 500; margin-right: 4px; }
  body.dark .sense .pos { color: #9ca3af; }
  .sense .eg { color: #6b7280; font-style: italic; font-size: 12px; margin-top: 1px; }
  body.dark .sense .eg { color: #9ca3af; }
  .more { margin-top: 2px; font-size: 11px; padding: 2px 6px; }
  .hw[contenteditable], .src[contenteditable] { outline: none; border-bottom: 1px dashed rgba(128,128,128,0.5); }
  .ai { margin-top: 8px; padding-top: 6px; border-top: 1px solid rgba(0,0,0,0.08); }
  body.dark .ai { border-color: rgba(255,255,255,0.10); }
  .ai h4 { margin: 0 0 2px; font-size: 11px; color: #0d9488; font-weight: 600; }
  .ai p { margin: 0; font-size: 12.5px; line-height: 1.55; white-space: pre-wrap; }
  .spinner {
    width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid rgba(59,130,246,0.25); border-top-color: #3b82f6;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="row">
      <span class="tag" id="tag">翻译中</span>
      <span class="src" id="src"></span>
    </div>
    <div class="out" id="out"><span class="spinner"></span></div>
    <div class="word" id="word">
      <div class="hw" id="hw"></div>
      <div class="ph" id="ph"></div>
      <div class="tags" id="tags"></div>
      <div class="main" id="main"></div>
      <div id="senses"></div>
      <button class="more" id="more" style="display:none">展开更多释义</button>
      <div class="ai" id="ai" style="display:none"><h4>AI 精解</h4><p id="aibody"></p></div>
    </div>
    <div class="foot">
      <button id="aiBtn" title="用 DeepSeek 精解这个词">✨ 精解</button>
      <button id="speak" title="朗读这个词">朗读</button>
      <button id="find" title="在主窗口里查这个词">查词</button>
      <button id="retrans" title="改完原文后回车重译" style="display:none">重译</button>
      <button id="save">存生词</button>
      <button id="copy">复制</button>
      <span class="grow"></span>
      <button id="close">关闭</button>
    </div>
  </div>
<script>
  const api = window.__TAURI__;
  const $ = (id) => document.getElementById(id);
  const dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  if (dark) document.body.classList.add('dark');

  let last = null;
  // 「展开更多释义」的状态：默认最多显示 3 个义项、每项 2 条例句，跟 macOS 卡片一致
  let moreOpen = false;

  function renderCard(p) {
    const c = p.card || {};
    const more = $('more');
    const card = $('card');
    card.classList.add('is-word');
    $('hw').textContent = p.source || '';
    const ph = (c.phonetics || []).map((x) => (x.label ? x.label + ' ' : '') + x.text).join('   ');
    $('ph').textContent = ph || c.phonetic || '';
    $('tags').innerHTML = '';
    for (const t of (c.tags || [])) {
      const s = document.createElement('span');
      s.className = 'tag';
      s.textContent = t;
      $('tags').appendChild(s);
    }
    $('main').textContent = p.loading ? '翻译中…' : (p.text || '');
    const box = $('senses');
    box.innerHTML = '';
    let shown = 0;
    for (const s of (c.senses || [])) {
      if (!s.defs || !s.defs.length) continue;
      if (!moreOpen && shown >= 3) {
        more.style.display = '';
        break;
      }
      shown++;
      const d = document.createElement('div');
      d.className = 'sense';
      const pos = document.createElement('span');
      pos.className = 'pos';
      pos.textContent = s.pos || '';
      d.appendChild(pos);
      d.appendChild(document.createTextNode(s.defs.join('；')));
      // 例句：macOS 卡片一直有，webview 气泡以前完全没渲染
      for (const ex of (s.examples || []).slice(0, moreOpen ? 4 : 2)) {
        if (!ex) continue;
        const e = document.createElement('div');
        e.className = 'eg';
        e.textContent = ex;
        d.appendChild(e);
      }
      box.appendChild(d);
    }
    if (shown < (c.senses || []).length) more.style.display = '';
    else more.style.display = 'none';
    $('speak').style.display = c.mode === 'word' ? '' : 'none';
    $('find').style.display = c.mode === 'word' ? '' : 'none';
    if (c.ai) { $('ai').style.display = 'block'; $('aibody').textContent = c.ai; }
    else { $('ai').style.display = 'none'; }
    $('aiBtn').style.display = c.mode === 'word' ? '' : 'none';
    if (p.error) {
      const e = document.createElement('div');
      e.className = 'err';
      e.textContent = p.error;
      box.appendChild(e);
    }
    scheduleFit();
  }

  function render(p) {
    log('render loading=' + (p && p.loading) + ' err=' + (p && p.error) + ' len=' + ((p && p.text) || '').length);
    last = p;
    const isWord = p && p.card && p.card.mode === 'word' && (p.loading || (p.card.senses && p.card.senses.length));
    if (isWord) { renderCard(p); return; }
    $('card').classList.remove('is-word');
    // 句子卡片上没有朗读/查词/更多释义，收起来（窗口是复用的，别留下上一张卡片的按钮）
    $('speak').style.display = 'none';
    $('find').style.display = 'none';
    $('more').style.display = 'none';
    $('retrans').style.display = 'none';
    $('src').textContent = (p.source || '').replace(/\s+/g, ' ').slice(0, 90);
    if (p.loading) {
      $('tag').textContent = '翻译中';
      $('out').innerHTML = '<span class="spinner"></span>';
      return;
    }
    if (p.error) {
      $('tag').textContent = '失败';
      $('out').innerHTML = '';
      const e = document.createElement('div');
      e.className = 'err';
      e.textContent = p.error === 'empty' ? '没有选中内容' : ('翻译失败：' + p.error);
      $('out').appendChild(e);
      return;
    }
    $('tag').textContent = (p.detected || 'auto') + ' → ' + (p.target || '');
    $('out').textContent = p.text || '';
    scheduleFit();
  }

  window.__slipRender = (p) => { try { render(p); } catch (e) { log('render threw ' + e); } };

  // 窗口高度由内容决定：先临时解除「撑满窗口」的限制，量出自然高度再报给 Rust。
  // （.card 平时是 height:calc(100vh-8px)，不解除就永远量到当前窗口高度）
  let fitTimer = 0;
  function fitWindow() {
    const card = $('card');
    const prev = card.style.height;
    card.style.height = 'auto';
    const h = Math.ceil(card.getBoundingClientRect().height) + 8; // 加上下各 4px 外边距
    card.style.height = prev;
    if (h > 60) api.core.invoke('resize_bubble', { height: h }).catch(() => {});
  }
  function scheduleFit() {
    clearTimeout(fitTimer);
    // 等字体/布局稳定再量，避免量到半成品
    fitTimer = setTimeout(() => { try { fitWindow(); } catch (_) {} }, 30);
  }

  const log = (m) => { try { api && api.core.invoke('js_log', { message: String(m) }); } catch (_) {} };
  log('boot api=' + !!api + ' hasEvent=' + !!(api && api.event) + ' hasCore=' + !!(api && api.core));

  if (api) {
    window.__slipRender = (p) => render(p);
    api.event.listen('slip://payload', (e) => { log('event'); render(e.payload); });
    // 窗口刚创建时 emit 可能早于本脚本执行，加载完主动拉一次最新内容
    api.core.invoke('bubble_state').then((p) => { log('state pull ' + !!p); if (p) render(p); }).catch((e) => log('state pull failed ' + e));
    $('close').onclick = () => { try { api.core.invoke('hide_bubble'); } catch (_) {} try { api.window.getCurrentWindow().hide(); } catch (_) {} };
    $('aiBtn').onclick = async () => {
      if (!last || !last.source) return;
      $('aiBtn').textContent = '✨ 精解中…';
      try {
        const ai = await api.core.invoke('ai_explain', { word: last.source });
        last.card = last.card || {};
        last.card.ai = ai;
        render(last);
      } catch (err) {
        $('aiBtn').textContent = '✨ 失败';
        setTimeout(() => { $('aiBtn').textContent = '✨ 精解'; }, 1600);
        return;
      }
      $('aiBtn').textContent = '✨ 精解';
      // 精解会让卡片变高，重新量一次并请 Rust 调窗口大小
      scheduleFit();
    };
    $('save').onclick = async () => {
      if (!last || !last.source || !last.text) return;
      try {
        const added = await api.core.invoke('add_vocab', {
          source: last.source,
          text: last.text,
          detected: last.detected || '',
          target: last.target || '',
        });
        $('save').textContent = added ? '已存入' : '已在生词本';
      } catch (err) {
        $('save').textContent = '没存上';
      }
      setTimeout(() => { $('save').textContent = '存生词'; }, 1400);
    };
    $('copy').onclick = async () => {
      const text = $('out').innerText || '';
      if (!text) return;
      try {
        await navigator.clipboard.writeText(text);
      } catch (_) {
        const ta = document.createElement('textarea');
        ta.value = text; document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); ta.remove();
      }
      $('copy').textContent = '已复制';
      setTimeout(() => { $('copy').textContent = '复制'; }, 1200);
    };
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { try { api.core.invoke('hide_bubble'); } catch (_) {} try { api.window.getCurrentWindow().hide(); } catch (_) {} }
    });

    // ---- 朗读：走 WebView2 内置的 speechSynthesis，不依赖任何原生库 ----
    // 系统里没有对应语音包时 speechSynthesis 会静默失败，这里留一条日志方便排查。
    $('speak').onclick = () => {
      const word = (last && last.source) || $('hw').innerText || '';
      if (!word) return;
      if (!window.speechSynthesis) { log('tts: speechSynthesis 不可用'); return; }
      try {
        const voices = window.speechSynthesis.getVoices() || [];
        const lang = /[一-龥]/.test(word) ? 'zh-CN' : 'en-US';
        if (voices.length && !voices.some(v => (v.lang || '').toLowerCase().startsWith(lang.slice(0, 2)))) {
          log(`tts: 没有 ${lang} 语音包（现有 ${voices.map(v => v.lang).join(',')}）`);
        }
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(word);
        u.lang = lang;
        u.rate = 0.95;
        window.speechSynthesis.speak(u);
        $('speak').textContent = '…';
        setTimeout(() => { $('speak').textContent = '朗读'; }, 1200);
      } catch (e) {
        log('tts error: ' + e);
      }
    };

    // ---- 查词：把词丢进主窗口的翻译框 ----
    $('find').onclick = () => {
      const word = (last && last.source) || $('hw').innerText || '';
      if (!word) return;
      api.core.invoke('open_word_in_main', { word }).catch(() => {});
      try { api.core.invoke('hide_bubble'); } catch (_) {}
    };

    // ---- 改原文重译：点原文就能改，回车或点「重译」重新翻一遍 ----
    const editable = [['src', () => $('src').innerText], ['hw', () => $('hw').innerText]];
    function doRetranslate() {
      const text = ($('src').innerText || $('hw').innerText || '').trim();
      if (!text) return;
      $('retrans').style.display = 'none';
      $('retrans').textContent = '重译中…';
      api.core.invoke('retranslate', { text }).catch(() => {});
      setTimeout(() => { $('retrans').textContent = '重译'; }, 2000);
    }
    for (const [id] of editable) {
      const el = $(id);
      el.setAttribute('contenteditable', 'plaintext-only');
      el.spellcheck = false;
      el.addEventListener('mousedown', () => { try { api.core.invoke('bubble_focus'); } catch (_) {} });
      el.addEventListener('input', () => { $('retrans').style.display = ''; });
      el.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); el.blur(); doRetranslate(); }
      });
    }
    $('retrans').onclick = doRetranslate;

    $('more').onclick = () => {
      moreOpen = !moreOpen;
      $('more').textContent = moreOpen ? '收起释义' : '展开更多释义';
      if (last) render(last);
    };
    // 鼠标停在气泡上时不自动消失（Rust 侧的 25 秒倒计时会暂停）
    document.body.addEventListener('mouseenter', () => {
      try { api.core.invoke('bubble_hover', { hovering: true }); } catch (_) {}
    });
    document.body.addEventListener('mouseleave', () => {
      try { api.core.invoke('bubble_hover', { hovering: false }); } catch (_) {}
    });

    // 按住卡片空白处可以拖动气泡（macOS 面板是 isMovableByWindowBackground）。
    // 点在按钮、可编辑文本、链接上时不拖，避免抢掉点击和选字。
    document.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;
      const t = e.target;
      if (!t || t.closest('button, a, input, textarea, [contenteditable]')) return;
      e.preventDefault();
      try { api.core.invoke('drag_bubble'); } catch (_) {}
    });
  }
</script>
</body>
</html>
