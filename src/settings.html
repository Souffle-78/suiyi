<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>随译 · 设置</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff; --fg: #1f2328; --muted: #6b7280; --line: rgba(0,0,0,.10);
    --fill: rgba(0,0,0,.03); --brand: #2563eb;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1c1c1e; --fg: #ececf1; --muted: #9ca3af; --line: rgba(255,255,255,.12); --fill: rgba(255,255,255,.06); }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font: 13px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .wrap { max-width: 520px; margin: 0 auto; padding: 22px 22px 90px; }
  h1 { font-size: 17px; margin: 0 0 2px; }
  .sub { color: var(--muted); font-size: 12px; margin-bottom: 18px; }
  section { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 14px; }
  section h2 { font-size: 13px; margin: 0 0 10px; font-weight: 600; }
  label.field { display: block; margin-bottom: 12px; }
  label.field:last-child { margin-bottom: 0; }
  .lbl { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
  select, input[type=text], input[type=password], textarea {
    width: 100%; font: inherit; color: inherit; background: var(--fill);
    border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; outline: none;
  }
  select:focus, input:focus, textarea:focus { border-color: var(--brand); }
  textarea { min-height: 92px; resize: vertical; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  .radios { display: flex; gap: 10px; }
  .radio {
    flex: 1; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
    cursor: pointer; background: var(--fill);
  }
  .radio.on { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand) inset; }
  .radio b { display: block; font-size: 13px; margin-bottom: 2px; }
  .radio span { font-size: 11.5px; color: var(--muted); }
  .hidden { display: none; }
  .bar {
    position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 22px;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: saturate(1.4) blur(12px);
    border-top: 1px solid var(--line);
    display: flex; align-items: center; gap: 12px;
  }
  .status { font-size: 12px; color: var(--muted); flex: 1; }
  button {
    font: inherit; padding: 7px 16px; border-radius: 8px; cursor: pointer;
    border: 1px solid transparent; background: var(--brand); color: #fff;
  }
  button:disabled { opacity: .6; cursor: default; }
  .tip { font-size: 11.5px; color: var(--muted); margin-top: 6px; }
  .row-check { display: flex; align-items: center; gap: 8px; font-size: 12.5px; cursor: pointer; }
  .row-check input { width: 14px; height: 14px; accent-color: var(--brand); }
</style>
</head>
<body>
<div class="wrap">
  <h1>随译设置</h1>
  <div class="sub">选中文字松手即翻译。改完保存，立刻生效，不用重启。</div>

  <section>
    <h2>译成</h2>
    <label class="field">
      <select id="target">
        <option value="zh-CN">简体中文</option>
        <option value="zh-TW">繁体中文</option>
        <option value="en">英语</option>
        <option value="ja">日语</option>
        <option value="ko">韩语</option>
        <option value="fr">法语</option>
        <option value="de">德语</option>
        <option value="es">西班牙语</option>
        <option value="ru">俄语</option>
        <option value="pt">葡萄牙语</option>
      </select>
    </label>
  </section>

  <section>
    <h2>翻译线路</h2>
    <div class="radios">
      <div class="radio on" data-provider="google">
        <b>免费线路</b>
        <span>Google · 免 key · 快</span>
      </div>
      <div class="radio" data-provider="deepseek">
        <b>DeepSeek 精翻</b>
        <span>术语表 · 更自然 · 需 key</span>
      </div>
    </div>
    <div id="ds-box" class="hidden" style="margin-top:12px">
      <label class="field">
        <span class="lbl">DeepSeek API Key</span>
        <input id="key" type="password" placeholder="sk-…" autocomplete="off" />
      </label>
      <label class="field">
        <span class="lbl">模型</span>
        <input id="model" type="text" placeholder="deepseek-chat" />
      </label>
    </div>
  </section>

  <section>
    <h2>术语表（可选）</h2>
    <label class="field">
      <textarea id="glossary" placeholder="一行一条，用 = 分隔，例如：
prompt = 提示词
embedding = 嵌入
token = 词元"></textarea>
    </label>
    <div class="tip">只在「DeepSeek 精翻」时生效，会强制按你的译法翻。</div>
  </section>

  <section>
    <h2>启动与常驻</h2>
    <label class="row-check">
      <input id="autostart" type="checkbox" />
      <span>开机自动启动（登录后常驻菜单栏，不占 Dock）</span>
    </label>
    <div class="tip">关掉后随译仍在菜单栏里，随时可以从托盘菜单退出。</div>
  </section>

  <div class="bar">
    <span class="status" id="status"></span>
    <button id="save">保存</button>
  </div>
</div>

<script>
  const api = window.__TAURI__;
  const $ = (id) => document.getElementById(id);
  let provider = 'google';

  function paintProvider() {
    document.querySelectorAll('.radio').forEach((el) => {
      el.classList.toggle('on', el.dataset.provider === provider);
    });
    $('ds-box').classList.toggle('hidden', provider !== 'deepseek');
  }

  document.querySelectorAll('.radio').forEach((el) => {
    el.onclick = () => { provider = el.dataset.provider; paintProvider(); };
  });

  function glossaryToText(list) {
    return (list || []).map((g) => g.from + ' = ' + g.to).join('\n');
  }

  function textToGlossary(text) {
    return text.split('\n').map((line) => line.trim()).filter(Boolean).map((line) => {
      const i = line.indexOf('=');
      if (i < 0) return { from: line, to: '' };
      return { from: line.slice(0, i).trim(), to: line.slice(i + 1).trim() };
    }).filter((g) => g.from);
  }

  const autostartBox = $('autostart');
  autostartBox.onchange = async () => {
    if (!api) return;
    try {
      const now = await api.core.invoke('set_autostart', { enabled: autostartBox.checked });
      autostartBox.checked = !!now;
      $('status').textContent = now ? '已设为开机自启' : '已取消开机自启';
      setTimeout(() => { $('status').textContent = ''; }, 1800);
    } catch (e) {
      autostartBox.checked = !autostartBox.checked;
      $('status').textContent = '设置失败：' + e;
    }
  };

  async function load() {
    if (!api) { $('status').textContent = '需要在随译窗口里打开'; return; }
    try { autostartBox.checked = await api.core.invoke('get_autostart'); } catch (_) {}
    const cfg = await api.core.invoke('get_config');
    $('target').value = cfg.target || 'zh-CN';
    provider = cfg.provider === 'deepseek' ? 'deepseek' : 'google';
    $('key').value = cfg.deepseek_key || '';
    $('model').value = cfg.deepseek_model || 'deepseek-chat';
    $('glossary').value = glossaryToText(cfg.glossary);
    paintProvider();
  }

  $('save').onclick = async () => {
    if (!api) return;
    $('save').disabled = true;
    $('status').textContent = '保存中…';
    const cfg = {
      target: $('target').value,
      provider,
      deepseek_key: $('key').value.trim(),
      deepseek_model: $('model').value.trim() || 'deepseek-chat',
      glossary: textToGlossary($('glossary').value),
    };
    try {
      await api.core.invoke('set_config', { cfg });
      $('status').textContent = provider === 'deepseek' && !cfg.deepseek_key
        ? '已保存，但 DeepSeek 还没填 key，会提示失败'
        : '已保存，立即生效';
    } catch (e) {
      $('status').textContent = '保存失败：' + e;
    }
    $('save').disabled = false;
    setTimeout(() => { $('status').textContent = ''; }, 3200);
  };

  load();
</script>
</body>
</html>
