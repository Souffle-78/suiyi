name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - platform: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
          - platform: windows-latest
            target: ""
            bundles: nsis

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci --no-fund --no-audit

      # macOS：先把气泡助手的 NSPanel 二进制编出来（bundle.resources 会把它塞进 App）
      - name: build bubble helper
        if: runner.os == 'macOS'
        shell: bash
        run: bash scripts/make-helper.sh

      # macOS runner 上没有我们的自签证书，用 CI 配置把 signingIdentity 关掉
      - name: build
        shell: bash
        run: npx tauri build ${{ matrix.target != '' && format('--target {0}', matrix.target) || '' }} --bundles ${{ matrix.bundles }} --config src-tauri/tauri.ci.conf.json

      - name: list bundles
        shell: bash
        run: ls -R "src-tauri/target" | grep -A2 -iE "bundle|\\.dmg|\\.exe" | head -40 || true

      - uses: actions/upload-artifact@v4
        with:
          name: suiyi-${{ matrix.platform }}-${{ matrix.target || 'native' }}
          path: src-tauri/target/**/release/bundle/**
          if-no-files-found: warn

  # 打 tag（v0.7.1 这种）时把安装包挂到 GitHub Release 上，
  # 这样用户能直接从 Releases 页面下载，不用自己装 Rust 编译。
  # 用 !cancelled() 而不是默认的「成功才跑」：万一 macOS 某个架构挂了，
  # Windows 的安装包也要能挂上去，不能因为一个矩阵失败就让所有人下不到。
  publish:
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: collect installers
        run: |
          mkdir -p dist
          ver="${GITHUB_REF_NAME#v}"
          # 安装包文件名里带中文（productName 是「随译」），download-artifact 在
          # ubuntu runner 上解出来的文件名可能被 locale 弄成乱码（实测变成 "_0.8.0_x64-setup.exe"）。
          # 这里统一重命名成纯 ASCII 的 Suiyi_<版本>_<架构>，和 v0.7.x 那些老 release 一致。
          find artifacts -type f \( -name '*.exe' -o -name '*.dmg' \) -print0 |
          while IFS= read -r -d '' f; do
            base="$(basename "$f")"
            case "$base" in
              *aarch64.dmg) out="Suiyi_${ver}_aarch64.dmg" ;;
              *x64.dmg)     out="Suiyi_${ver}_x64.dmg" ;;
              *setup.exe)   out="Suiyi_${ver}_x64-setup.exe" ;;
              *)            out="Suiyi_${ver}_${base##*_}" ;;
            esac
            echo "rename: $f -> dist/$out"
            cp "$f" "dist/$out"
          done
          ls -l dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: false
          generate_release_notes: true
          body: |
            随译 Suiyi ${{ github.ref_name }}

            - Windows：下载 `Suiyi_*_x64-setup.exe`（NSIS 安装包，未签名，SmartScreen 会提示「更多信息 → 仍要运行」）
            - macOS：下载 `Suiyi_*_aarch64.dmg`（Apple 芯片）或 `Suiyi_*_x64.dmg`（Intel）

            首次运行 Windows 版：托盘出现图标即可划词；设置页可填 DeepSeek API Key。
            首次运行 macOS 版：需要在「系统设置 → 隐私与安全性 → 辅助功能」里勾选随译。
