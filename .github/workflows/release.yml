name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - platform: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
          - platform: windows-latest
            target: ""
            bundles: nsis

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --no-fund --no-audit

      # macOS：先把气泡助手的 NSPanel 二进制编出来（bundle.resources 会把它塞进 App）
      - name: build bubble helper
        if: runner.os == 'macOS'
        shell: bash
        run: bash scripts/make-helper.sh

      # macOS runner 上没有我们的自签证书，用 CI 配置把 signingIdentity 关掉
      - name: build
        shell: bash
        run: npx tauri build ${{ matrix.target != '' && format('--target {0}', matrix.target) || '' }} --bundles ${{ matrix.bundles }} --config src-tauri/tauri.ci.conf.json

      - name: list bundles
        shell: bash
        run: ls -R "src-tauri/target" | grep -A2 -iE "bundle|\\.dmg|\\.exe" | head -40 || true

      - uses: actions/upload-artifact@v4
        with:
          name: suiyi-${{ matrix.platform }}-${{ matrix.target || 'native' }}
          path: src-tauri/target/**/release/bundle/**
          if-no-files-found: warn

  # 打 tag（v0.7.1 这种）时把安装包挂到 GitHub Release 上，
  # 这样用户能直接从 Releases 页面下载，不用自己装 Rust 编译。
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: collect installers
        run: |
          mkdir -p dist
          find artifacts -type f \( -name '*.exe' -o -name '*.dmg' \) -print -exec cp {} dist/ \;
          ls -l dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: false
          generate_release_notes: true
          body: |
            随译 Suiyi ${{ github.ref_name }}

            - Windows：下载 `随译_*_x64-setup.exe`（NSIS 安装包，未签名，SmartScreen 会提示「更多信息 → 仍要运行」）
            - macOS：下载 `随译_*_aarch64.dmg`（Apple 芯片）或 `随译_*_x64.dmg`（Intel）

            首次运行 Windows 版：托盘出现图标即可划词；设置页可填 DeepSeek API Key。
            首次运行 macOS 版：需要在「系统设置 → 隐私与安全性 → 辅助功能」里勾选随译。
