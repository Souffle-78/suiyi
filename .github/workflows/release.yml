name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - platform: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
          - platform: ubuntu-22.04
            target: ""
            bundles: deb,appimage
          - platform: windows-latest
            target: ""
            bundles: msi,nsis

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: install linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libx11-dev \
            libxtst-dev \
            libxkbcommon-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --no-fund --no-audit

      # macOS runner 上没有我们的自签证书，用 CI 配置把 signingIdentity 关掉
      - name: build
        run: |
          npx tauri build \
            ${{ matrix.target != '' && format('--target {0}', matrix.target) || '' }} \
            --bundles ${{ matrix.bundles }} \
            --config src-tauri/tauri.ci.conf.json

      - name: list bundles
        shell: bash
        run: ls -R "src-tauri/target" | grep -A2 -iE "bundle|\\.dmg|\\.msi|\\.exe|\\.deb|\\.AppImage" | head -40 || true

      - uses: actions/upload-artifact@v4
        with:
          name: suiyi-${{ matrix.platform }}-${{ matrix.target || 'native' }}
          path: src-tauri/target/**/release/bundle/**
          if-no-files-found: warn
